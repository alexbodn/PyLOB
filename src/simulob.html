<!DOCTYPE html>
<html lang="en-us">
<head>
	<script>
		let strategies = [
			"peakswinger",
			"percentnhalf",
		];
		let dates = [
			'2009-09-28',
			'2009-09-29',
			'2009-09-30',
			/*
			'2009-10-01',
			'2009-10-02',
			'2009-10-05',
			'2009-10-06',
			*/
		];
	</script>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon" />
	<title>simulob</title>
	<style>
		.warning, .error {color: red}
		.error {background-color: yellow}
		.lob-header * {
			float: left;
		}

		table#buttons td {
			padding-left: 15px;
			padding-right: 15px;
		}
	</style>
	<style>
		div#sqlQuery {
			height: 90vh;
		}
	</style>
	<script src="./node_modules/sqlitexplorer/lib/sqlitexplorer.js"></script>
</head>
<body>
	<h1>simulob</h1>
	<div style="float0: left;">
	<div>
		<div>
		<h3 class="lob-header">
			<img id="loading" src="./loading.png" style="display: none; height: 20px;" />
			<img id="paused" src="./paused.png" style="display: none; height: 20px;" />
			<span>NLV</span>
			<span id="nlv"></span>
		</h3>
		</div>
		<table>
			<tbody id="balance"></tbody>
		</table>
	</div>
	<div>
	<table>
		<tbody id="status"></tbody>
	</table>
	</div>
	</div>
	<div class="clear"></div>
	<div>
	<table id="buttons" style="display: none">
		<tbody>
		<tr>
			<td><input value="👾" title="debug" id="debug" type="button" onclick="sob.setDebug();" /></td>
			<td><button title="stop debug" id="stop-debug" onclick="sob.setDebug(false);"><strike>👾</strike></button></td>
			<td><input value="🧹" title="reset" id="pause" type="button" onclick="simuReset();" /></td>
			<td><input value="⏸️" title="pause" id="pause" type="button" onclick="sob.pause();" /></td>
			<td><input value="⏹️" title="stop" id="stop" type="button" onclick="simuStop();" /></td>
			<td><input value="▶️" title="run" id="run" type="button" onclick="simuPlay();" /></td>
		</tr>
		</tbody>
	</table>
	</div>
	<div id="sqlQuery" class="sqlQuery"></div>
	
	<script src="./PyLOB/worker.js"></script>
	<script src="./PyLOB/orderbook.js"></script>
	<!--script src="./example.js"></script-->
	<script src="./PyLOB/simulob/simu_strategy.js"></script>
	<script src="./PyLOB/simulob/simulob.js"></script>
	<script src="./PyLOB/simulob/simu_console.js"></script>
	
	<script src="./PyLOB/chart/chartjs-4.4.0/chart.umd.min.js"></script>
	<script src="./PyLOB/chart/chartjs-datalabels/chartjs-plugin-datalabels.min.js"></script>

	<script src="./PyLOB/hammerjs/hammer.min.js"></script>
	<script src="./PyLOB/chart/chartjs-zoom/chartjs-plugin-zoom.min.js"></script>
	<!--script src="./PyLOB/chart/chartjs-streaming/chartjs-plugin-streaming.min.js"></script-->
	<script src="./PyLOB/luxon/luxon.min.js"></script>
	<script src="./PyLOB/chart/chartjs-luxon/chartjs-adapter-luxon.js"></script>
	
	<!--script src="./PyLOB/eruda/eruda.js"></script-->
	<script src="./PyLOB/file-saver/FileSaver.js"></script>
	<script src="./PyLOB/csv/papaparse.min.js"></script>
	<script src="./require.js"></script>
	<script>
	window.sqlConsole = new SQLiteXplorer('div#sqlQuery');
	const log = (...args)=>sqlConsole.log(...args);
	const warn = (...args)=>sqlConsole.warn(...args);
	const error = (...args)=>sqlConsole.error(...args);
	const logHtml = (...args)=>sqlConsole.logHtml(...args);
	</script>
	<script>
		try {
			let buttons = document.querySelector("#buttons");
			buttons.style.display = 'table';
			
			// loading strategies
			Promise.all(
				strategies.map(strategy => {
					//return jsLoad(`./PyLOB/simulob/strategies/${strategy}.js`);
					return require(`./PyLOB/simulob/strategies/${strategy}`);
				})
			)
			.then(() => {
				SimuStrategy.strategyChoice(sqlConsole, dates);
			});
		}
		catch(e){
			warn("Exception:",e.message);
		}
	</script>
	<script>
	function simuReset() {
		let tabs = Array.from(
			document.querySelectorAll('span.tab-close'), 
			x => x.closest('span[data-search-tag]'));
		console.log();
		tabs.concat(sqlConsole.tabSearch('schema')).forEach(tab => {sqlConsole.tabClose(tab)})
	}
	
	function simuStop() {
		if (window.sob) {
			sob.close();
			window.sob = undefined;
		}
	}
	function simuPlay() {
		if (window.sob && sob.dopause) {
			sob.pause(false);
		}
		else {
			simuStop();
			runsob(oo);
		}
	}
	function runsob(oo) {
		if (!window.strategyClass) {
			alert('please activate one of the strategies');
			return;
		}
		const simuLocation = new URL('PyLOB/simulob', window.location.href);
		window.sob = new SimuLOB(
			oo, simuLocation,
			new SimuForwarder()
		);
		window.sob.init(window.strategyClass).then(
			obj => {
				window.sqlConsole.setDb(sob.db);
				
				window.sob.run(dates);
			}
		);
	}
	</script>
	<!--script>window.eruda && (eruda._isInit || eruda.init());</script-->
</body>
</html>
